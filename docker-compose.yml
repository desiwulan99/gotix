services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: gotix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotix_user
      POSTGRES_PASSWORD: gotix_password
      POSTGRES_DB: gotix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotix_user -d gotix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Express API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gotix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://gotix_user:gotix_password@postgres:5432/gotix_db?schema=public
      JWT_SECRET: super_secret_jwt_key_for_gotix_subtle_gothic_luxury_2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      EXPIRY_WORKER_INTERVAL_MS: 30000
      ORDER_EXPIRY_MINUTES: 15
    ports:
      - "5000:5000"

  # 3. Frontend React + Vite SPA Service (via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gotix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
