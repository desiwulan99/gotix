services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: gotix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gotix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gotix_password}
      POSTGRES_DB: ${POSTGRES_DB:-gotix_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gotix_user} -d ${POSTGRES_DB:-gotix_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # 2. Backend Express API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gotix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gotix_user}:${POSTGRES_PASSWORD:-gotix_password}@postgres:5432/${POSTGRES_DB:-gotix_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_gotix_subtle_gothic_luxury_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      EXPIRY_INTERVAL_MS: ${EXPIRY_INTERVAL_MS:-30000}
      ORDER_EXPIRY_MINUTES: ${ORDER_EXPIRY_MINUTES:-15}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-gotix_webhook_hmac_secret_key_2026}
    ports:
      - "3000:5000"
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', (r) => { if (r.statusCode !== 200) process.exit(1); })\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Frontend React + Vite SPA Service (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gotix-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
      - "5173:80"

volumes:
  postgres_data:
