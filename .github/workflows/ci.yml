name: GOTIX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test-and-build:
    name: Backend Test, Lint & Docker Push
    runs-on: ubuntu-latest

    # Setup PostgreSQL service container untuk integration & concurrency testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotix_user
          POSTGRES_PASSWORD: gotix_password
          POSTGRES_DB: gotix_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 4. Generate Prisma Client & Run Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://gotix_user:gotix_password@localhost:5432/gotix_db?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: 5. Run Automated Tests (Unit, Integration, & Concurrency 200 Requests)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://gotix_user:gotix_password@localhost:5432/gotix_db?schema=public
          JWT_SECRET: ci_test_secret_key_gotix_2026
          PORT: 5000
        run: npm test

      - name: 6. TypeScript Type Check & Build
        working-directory: ./backend
        run: npm run build

      - name: 7. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 8. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 9. Extract Docker Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 10. Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  frontend-build:
    name: Frontend Type Check, Build & Docker Push
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. TypeScript Check & Vite Build
        working-directory: ./frontend
        run: npm run build

      - name: 5. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Extract Docker Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 8. Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
