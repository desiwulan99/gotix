name: GOTIX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Automated Tests & Type Checking
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotix_user
          POSTGRES_PASSWORD: gotix_password
          POSTGRES_DB: gotix_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Test & Build
      - name: 3. Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 4. Generate Prisma & Deploy Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://gotix_user:gotix_password@localhost:5432/gotix_db?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: 5. Run Backend Integration & Concurrency Tests (7 Test Suites)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://gotix_user:gotix_password@localhost:5432/gotix_db?schema=public
          JWT_SECRET: ci_test_secret_key_gotix_2026
          WEBHOOK_SECRET: ci_webhook_secret_key_2026
          PORT: 5000
        run: npm test

      - name: 6. Build Backend (TypeScript Compilation)
        working-directory: ./backend
        run: npm run build

      # Frontend Test & Build
      - name: 7. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 8. Run Frontend Unit Tests (ticketRules)
        working-directory: ./frontend
        run: npm test

      - name: 9. Build Frontend (Vite Production Build)
        working-directory: ./frontend
        run: npm run build

  docker:
    name: Build & Push Images to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Convert Repository Name to Lowercase
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Backend
      - name: 5. Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 6. Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # Build & Push Frontend
      - name: 7. Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 8. Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
